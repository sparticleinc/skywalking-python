# Manual fallback only. Release tags are published by CircleCI (.circleci/config.yml); GitHub
# Actions has not run in this repository since 2026-06. Keeping a tag trigger here as well would
# upload the same version twice once Actions runs again (PyPI rejects the second upload).
# Run it from a v* tag ref with "Run workflow" to publish through PyPI trusted publishing.
name: publish-pypi

on:
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source codes
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip "packaging>=24.2" poetry twine
      - name: Verify tag matches package version
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: python tools/check_tag_version.py "$GIT_TAG"
      - name: Generate gRPC protocol code
        # skywalking/protocol is generated and git-ignored; without this step the wheel
        # ships without it and `import skywalking.agent` fails (1.0.6 / 1.0.7).
        run: make gen-basic
      - name: Build package distributions
        run: poetry build
      - name: Smoke test the built wheel
        run: make wheel-smoke
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/sparticle-skywalking/
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
