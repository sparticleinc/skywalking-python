# Builds the distribution exactly as publish-pypi.yml does and imports it from a clean venv
# at the declared dependency floors, so a wheel that cannot be imported is caught on the PR
# instead of after the release tag is pushed (1.0.6 / 1.0.7 shipped without
# skywalking/protocol). Deliberately separate from CI.yaml: that workflow has a schedule
# trigger, and GitHub disables scheduled workflows after 60 days without repository activity,
# which would silently switch this check off too. No schedule here, and no publishing rights.
name: Wheel

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wheel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wheel-smoke:
    name: Build Wheel and Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source codes
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip poetry
      - name: Generate gRPC protocol code
        run: make gen-basic
      - name: Build package distributions
        run: poetry build
      - name: Smoke test the built wheel
        run: make wheel-smoke
