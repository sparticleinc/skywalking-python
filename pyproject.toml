[tool.poetry]
name = "sparticle-skywalking"
version = "1.0.7"
description = "The Python Agent for Apache SkyWalking, which provides the native tracing/metrics/logging/profiling abilities for Python projects."
license = "Apache-2.0"
authors = ["Sparticle Community <hy.zhu@sparticle.com>"]
maintainers = ["Sparticle Community <hy.zhu@sparticle.com>"]
readme = "README.md"
homepage = "https://github.com/sparticleinc/skywalking-python"
repository = "https://github.com/sparticleinc/skywalking-python"
documentation = "https://github.com/sparticleinc/skywalking-python/blob/main/README.md"
keywords = [
    "skywalking", "tracing", "metrics", "logging", "profiling", 
    "observability", "distributed-tracing", "apm",
    "python"
]
classifiers=[
    'License :: OSI Approved :: Apache Software License',

    'Operating System :: OS Independent',

    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
	'Programming Language :: Python :: 3.13',
	'Programming Language :: Python :: 3.14',

    'Topic :: System :: Monitoring',
    'Topic :: Software Development',
]

packages = [
    { include = "skywalking" },
    { include = "sw_python" }
]

# poetry will ignore generated files as .gitignore, but we need them in both source and wheel distributions
include = [
    { path = "skywalking/protocol/**/*", format = ["sdist", "wheel"] }
]
exclude = ['tests', 'skywalking/**/__pycache__/*', 'skywalking/**/*.pyc']

[tool.poetry.build]
generate-setup-file = true

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/sparticleinc/skywalking-python/issues"

[tool.poetry.scripts]
sw-python = 'skywalking.bootstrap.cli.sw_python:start'


[tool.poetry.dependencies]
python = ">=3.10,<4.0"
grpcio = ">=1.76.0"
protobuf = ">=6.31.1,<7.0.0"
packaging = ">=23.0"
wrapt = ">=1.14"
psutil = ">=5.9"
requests = { version = ">=2.33.0", optional = true }
kafka-python = { version = ">=2.3.2", optional = true }
urllib3 = { version = ">=2.8.0,<3.0.0", optional = true }

[tool.poetry.extras]
all=[
    'requests',
    'kafka-python',
    'urllib3',
]
http= [
    'requests',
    'urllib3',
]
kafka=[
    'kafka-python',
]

[tool.poetry.group.dev.dependencies]
grpcio-tools = ">=1.76.0"
pkginfo = "^1.8.3"
testcontainers = ">=4.15.0"
pyyaml = "*"
pytest = ">=9.0.3"
uwsgi = ">=2.0.31"
gunicorn = ">=26.2.0"
uvicorn = "*"
kafka-python = ">=2.3.2"
requests = ">=2.33.0"
anyio = ">=4.14.2"
h11 = ">=0.16.0"
idna = ">=3.15"
jinja2 = ">=3.1.6"
setuptools = ">=83.0.0"
sqlparse = ">=0.6.0"
starlette = ">=1.3.1"
ujson = ">=5.13.0"
webob = ">=1.8.11"
frozenlist = ">=1.8.0"

[tool.poetry.group.plugins.dependencies]
urllib3 = ">=2.8.0,<3.0.0"
aiohttp = ">=3.14.4,<4.0.0"
celery = ">=5.6.3,<6.0.0"
django = ">=5.2.17,<6.0.0"
elasticsearch = "^7.15.1"
flask = ">=3.1.3,<4.0.0"
gevent = ">=26.9.0,<27.0.0"
hug = "^2.6.1"
pika = "^1.2.0"
psycopg = {extras = ["binary"], version = "^3.1.7"}
psycopg2-binary = "^2.9"
pymongo = ">=4.18.2,<5.0.0"
pymysql = ">=1.1.1,<2.0.0"
mysqlclient = "^2.1.1"
pyyaml = "^6.0"
redis = ">=8.1.0,<9.0.0"
tornado = ">=6.5.10,<7.0.0"
werkzeug = ">=3.1.9,<4.0.0"
fastapi = ">=0.143.0,<1.0.0"
uvicorn = "^0.44.0"
gunicorn = ">=26.2.0,<27.0.0"
bottle = "^0.12.21"
aiormq = "^6.4.2"
asyncpg = ">=0.32.0,<1.0.0"
