# Builds and publishes the sparticle-skywalking distribution on CircleCI, the CI the other
# sparticleinc repositories use (e.g. gtm-leads). GitHub Actions has not run in this repository
# since 2026-06, so neither the wheel check nor the tag-triggered publish there ran for 1.0.8.
#
# - wheel: every branch and every v* tag. Generates the gRPC protocol code (the generated
#   package is git-ignored; 1.0.6 / 1.0.7 shipped without it), builds the sdist and wheel, and
#   imports the built wheel from a clean venv at the declared protobuf / grpcio floors.
# - publish: v* tags only, after wheel passes, with the PyPI API token from the org context.
#   PyPI trusted publishing does not support CircleCI, so the token is a project-scoped PyPI
#   API token stored as PYPI_API_TOKEN in the context named below.

version: 2.1

jobs:
  wheel:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Fetch the protocol submodule
          # CircleCI's checkout does not fetch submodules; `make gen-basic` fails loudly
          # without the .proto sources.
          command: |
            set -euo pipefail
            git submodule sync --recursive
            git submodule update --init --recursive
      - run:
          name: Install build tooling
          command: python -m pip install --upgrade pip "packaging>=24.2" poetry twine
      - run:
          name: Verify the tag matches the package version
          command: |
            set -euo pipefail
            if [ -n "${CIRCLE_TAG:-}" ]; then
              python tools/check_tag_version.py "${CIRCLE_TAG}"
            else
              echo "Not a tag build; skipping the version check."
            fi
      - run:
          name: Generate gRPC protocol code
          command: make gen-basic
      - run:
          name: Build package distributions
          command: python -m poetry build
      - run:
          name: Smoke test the built wheel
          command: make wheel-smoke
      - run:
          name: Check distributions
          command: python -m twine check dist/*
      - store_artifacts:
          path: dist
      - persist_to_workspace:
          root: .
          paths:
            - dist

  publish:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Publish distributions to PyPI
          command: |
            set -euo pipefail
            : "${PYPI_API_TOKEN:?PYPI_API_TOKEN is required (CircleCI context pypi-sparticle-skywalking)}"
            python tools/check_tag_version.py "${CIRCLE_TAG}"
            python -m pip install --upgrade twine
            TWINE_USERNAME=__token__ TWINE_PASSWORD="${PYPI_API_TOKEN}" \
              python -m twine upload --non-interactive dist/*

workflows:
  wheel-and-publish:
    jobs:
      # Every branch (a PR is checked before it is merged) and every release tag; CircleCI
      # only runs a job on a tag when the job itself has a tag filter.
      - wheel:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - publish:
          context: pypi-sparticle-skywalking
          requires: [wheel]
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
